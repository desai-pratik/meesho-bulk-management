services:
  - type: web
    name: meesho-bulk-management
    runtime: docker
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: HEADLESS
        value: "false"
      - key: PORT
        value: "3001"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
